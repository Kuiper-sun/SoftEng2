name: sariwai
description: "Tilapia Fish Freshness Detection App"
publish_to: 'none'

version: 1.0.0+1

environment:
  # This SDK version is hypothetical as of late 2023.
  # Make sure it matches your actual Flutter SDK version.
  # For example, '>=3.0.0 <4.0.0' is more common.
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  http: ^1.1.0        # <-- ADD THIS LINE
  http_parser: ^4.0.2 # <-- AND ADD THIS LINE

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Updated to a more common version

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: CovikSans
      fonts:
        - asset: assets/fonts/CovikSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/CovikSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500